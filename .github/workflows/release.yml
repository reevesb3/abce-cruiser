# Builds cross-platform binaries on GitHub's runners and attaches them
# to the release whenever a v* tag is pushed (e.g. by publishing a release).
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # required to upload assets to the release

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [ linux, windows, darwin ]
        goarch: [ amd64, arm64 ]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          BIN=cruiser-${{ matrix.goos }}-${{ matrix.goarch }}
          [ "${{ matrix.goos }}" = "windows" ] && BIN="$BIN.exe"
          go build -v -trimpath -ldflags="-s -w" -o "dist/$BIN" ./cmd/cruiser

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
